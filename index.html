<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZiXun · 网站迁移通知</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Microsoft YaHei",
                sans-serif;
            background: #f5f7fa;
            color: #1f2937;
        }

        .container {
            width: min(90%, 520px);
            background: #ffffff;
            border-radius: 18px;
            padding: 48px 36px;
            text-align: center;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
        }

        .icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 24px;
            border-radius: 16px;
            background: #111827;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 700;
        }

        h1 {
            margin: 0 0 14px;
            font-size: 26px;
            font-weight: 650;
        }

        .description {
            margin: 0 auto 30px;
            line-height: 1.7;
            color: #6b7280;
            font-size: 15px;
        }

        .notice {
            padding: 14px 16px;
            margin-bottom: 28px;
            border-radius: 10px;
            background: #f3f4f6;
            color: #4b5563;
            font-size: 14px;
        }

        .download {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 50px;
            padding: 0 20px;
            border-radius: 10px;
            background: #111827;
            color: #ffffff;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            transition: 0.2s ease;
        }

        .download:hover {
            background: #374151;
            transform: translateY(-1px);
        }

        .download:active {
            transform: translateY(0);
        }

        .footer {
            margin-top: 28px;
            color: #9ca3af;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 38px 24px;
            }

            h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="icon">Z</div>

        <h1>网站已迁移</h1>

        <p class="description">
            ZiXun 网站已完成迁移。<br>
            当前页面已停止提供原有服务，请前往新的平台继续使用。
        </p>

        <div class="notice">
            如需继续使用 ZiXun，请下载最新版本客户端。
        </div>

        <!-- APK 与本 HTML 位于同一目录 -->
        <a class="download"
           href="./zixun.apk"
           download="zixun.apk">
            下载最新客户端（APK）
        </a>

        <div class="footer">
            ZiXun · Latest Client
        </div>

    </main>

</body>
</html>
